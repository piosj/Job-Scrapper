name: Daily AI Job Scraper

on:
  schedule:
    # UTC 기준 23:00 (한국시간 오전 8시)
    - cron: '0 23 * * *'
    # UTC 기준 09:00 (한국시간 오후 18시)
    - cron: '0 9 * * *'
  workflow_dispatch: # 수동 실행을 위한 버튼 활성화

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: config.py 셋업 (GitHub Secrets 활용)
        run: |
          echo "EMAIL_SENDER = '${{ secrets.EMAIL_SENDER }}'" > config.py
          echo "EMAIL_PASSWORD = '${{ secrets.EMAIL_PASSWORD }}'" >> config.py
          echo "EMAIL_RECEIVER = '${{ secrets.EMAIL_RECEIVER }}'" >> config.py

      - name: 크롤러 실행 (Scraper)
        run: python scraper.py

      - name: SQLite DB 상태 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f jobs.db
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: SQLite DB [skip ci]"
          git push
